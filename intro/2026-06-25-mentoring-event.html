# Membership
* Annual fee
  * $25 for students 
  * $290 for full members
  * [Recent graduates, ABS employees, and retired members are eligible for discounts](https://statsoc.org.au/Forum-general-topics/12893603)!
* Benefits include
  * Discounts on paid events and workshops
  * Mentoring program
  * ECSS Funding schemes
  * End of year ECSS Social Event
